name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Read version from package.json
        id: version
        run: echo "tag=v$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Check that the tag matches package.json
        if: github.ref_type == 'tag'
        run: test "${{ steps.version.outputs.tag }}" = "${GITHUB_REF_NAME}"

      - run: npm run lint

      - run: npm test

      - run: npm run build

      - name: Check that dist is up to date
        run: git diff --exit-code -- dist

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: dist/deye-inverter-card.js
          generate_release_notes: true
